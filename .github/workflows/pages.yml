# Publica RECORDATE en GitHub Pages cada vez que hay un push a main.
name: GitHub Pages # Nombre que se ve en la pestaña Actions del repositorio.
on: # Eventos que disparan este workflow.
  push: # Se ejecuta al subir commits.
    branches: [main] # Solo la rama principal (el código fuente).
  workflow_dispatch: # Permite lanzarlo a mano desde el botón "Run workflow".
permissions: # Permisos del GITHUB_TOKEN en este job.
  contents: write # Necesario para empujar la rama gh-pages con el sitio generado.
concurrency: # Evita dos deploys a la vez.
  group: pages # Agrupa ejecuciones de Pages.
  cancel-in-progress: true # Cancela un deploy viejo si entra uno nuevo.
jobs: # Lista de trabajos.
  build: # Único job: instala, construye y publica dist/.
    runs-on: ubuntu-latest # Máquina virtual Linux de GitHub.
    timeout-minutes: 15 # Evita jobs bloqueados indefinidamente.
    defaults: # Valores por defecto de los pasos "run".
      run: # Aplica a todos los comandos de shell.
        working-directory: ppi-react # La app Vite vive en esta carpeta, no en la raíz.
    steps: # Secuencia de pasos.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24.
        with: # Opciones del setup de Node.
          node-version: 22 # Misma familia de Node que usa el proyecto.
          cache: npm # Reutiliza la caché de paquetes entre ejecuciones.
          cache-dependency-path: ppi-react/package-lock.json # Lockfile de la app, no el de la raíz.
      - run: npm ci # Instala dependencias exactas del lockfile.
      - run: npm audit --omit=dev # Bloquea dependencias vulnerables incluidas en el producto.
      - run: npm run lint # Comprueba reglas de calidad y errores comunes.
      - run: npm test -- --run # Ejecuta las pruebas sin modo interactivo.
      - name: Optional GitHub secrets override # Si hay secretos de Actions, pisan el .env.production.
        env: # Inyecta secretos (vacíos si no existen).
          URL: ${{ secrets.VITE_SUPABASE_URL }} # URL del proyecto Supabase (opcional).
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }} # Clave pública/anon (opcional).
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }} # Client ID público de Google OAuth (opcional).
        run: | # Escribe en GITHUB_ENV solo las variables que sí tienen valor.
          if [ -n "$URL" ]; then echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"; fi # Override de URL si hay secreto.
          if [ -n "$KEY" ]; then echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"; fi # Override de clave si hay secreto.
          if [ -n "$GOOGLE_CLIENT_ID" ]; then echo "VITE_GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> "$GITHUB_ENV"; fi # Override de Client ID de Google.
      - run: npm run build # Genera la carpeta dist/ con el JS/CSS de producción.
        env: # Variables visibles para Vite durante el build.
          VITE_BASE: /PRYECTO-PPI/ # Prefijo de rutas de GitHub Pages (nombre del repo).
          VITE_DOCS_VERSION: ${{ github.sha }} # Evita reutilizar una respuesta 404 cacheada al publicar manuales.
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0, Node 24.
        with: # Opciones del action de Pages.
          github_token: ${{ secrets.GITHUB_TOKEN }} # Token del workflow para hacer push.
          publish_dir: ppi-react/dist # Carpeta ya construida que se vuelve el sitio.
          force_orphan: true # Commit huérfano: la rama gh-pages solo guarda el sitio, no el historial de fuente.
