name: Deploy Edge Functions

# Despliegue manual y reproducible desde el código del repositorio.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Función a desplegar (vacío = todas)"
        required: false
        default: "ai-chat"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Desplegar función
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: oavqxmsyhmtnnwkyiycr
          FUNCTION_NAME: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en el repositorio."
            exit 1
          fi
          if [ -n "$FUNCTION_NAME" ]; then
            supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF"
          else
            supabase functions deploy --project-ref "$PROJECT_REF"
          fi