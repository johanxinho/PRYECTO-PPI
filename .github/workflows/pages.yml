name: GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ppi-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ppi-react/package-lock.json
      - run: npm ci
      - name: Optional GitHub secrets override
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VAPID: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: |
          [ -n "$URL" ] && echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          [ -n "$KEY" ] && echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"
          [ -n "$VAPID" ] && echo "VITE_VAPID_PUBLIC_KEY=$VAPID" >> "$GITHUB_ENV"
      - run: npm run build
        env:
          VITE_BASE: /PRYECTO-PPI/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ppi-react/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
