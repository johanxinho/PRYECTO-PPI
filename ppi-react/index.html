<!doctype html> <!-- HTML5: documento raíz que Vite inyecta en el build. -->
<html lang="es-CO"> <!-- Español de Colombia para accesibilidad y SEO. -->
  <head> <!-- Metadatos, tipografías y título de la pestaña. -->
    <meta charset="UTF-8" /> <!-- Codificación UTF-8 para tildes y eñes. -->
    <meta name="theme-color" content="#0B1026" /> <!-- Color de la barra del navegador en móvil (navy RECORDATE). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Escala correcta en celulares. -->
    <meta name="description" content="RECORDATE, sistema de recordatorio de actividades académicas de la IE La Candelaria." /> <!-- Descripción para buscadores. -->
    <meta property="og:title" content="RECORDATE" /> <!-- Título al compartir el enlace en redes. -->
    <meta property="og:description" content="Agenda académica para recordar, organizar y priorizar tu día." /> <!-- Texto de la tarjeta Open Graph. -->
    <meta property="og:image" content="https://johanxinho.github.io/PRYECTO-PPI/og.jpg" /> <!-- Imagen absoluta para previsualización en redes. -->
    <meta property="og:locale" content="es_CO" /> <!-- Idioma de la tarjeta Open Graph. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> <!-- Favicon de la pestaña. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" /> <!-- Acelera la descarga de Google Fonts. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" /> <!-- Fraunces (títulos) y Outfit (texto). -->
    <title>RECORDATE | Agenda académica</title> <!-- Título visible en la pestaña del navegador. -->
  </head> <!-- Cierra el head. -->
  <body> <!-- Cuerpo: solo el ancla de React. -->
    <div id="root"></div> <!-- Aquí main.jsx monta toda la interfaz. -->
    <script type="module" src="/src/main.jsx"></script> <!-- Módulo de entrada; Vite lo resuelve y empaqueta. -->
  </body> <!-- Cierra el body. -->
</html> <!-- Cierra el documento. -->
